name: Build Debug APK

# Lightweight, personal debug build for the modified app.
# - Uses llama.rn PREBUILT libraries (no from-source C++ compile).
# - Builds arm64-v8a only (matches Snapdragon phones like the Honor 70).
# - Produces an unsigned-by-default debug APK installable directly on a phone.
# This workflow deliberately skips the upstream release quality gates
# (payload manifest, Hexagon SDK, plus-gate, automation DCE checks).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Override llama.rn's own android/gradle.properties (subproject beats root):
      # use prebuilt .so instead of compiling llama.cpp from source.
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'false'
      # Only build the architecture the target phone needs.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Free disk space: drop preinstalled toolchains we won't use.
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Grant execute permission for postinstall script
        run: chmod +x ./scripts/postinstall.sh

      - name: Install dependencies
        run: yarn install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # google-services plugin is applied at build time; Firebase needs a
      # (dummy) config even for an offline debug build.
      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.pocketpalai" }
              },
              "api_key": [{ "current_key": "dummy-api-key-for-ci-builds" }]
            }]
          }
          EOL

      - name: Create dummy .env
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Build debug APK (arm64-v8a, prebuilt llama.rn)
        working-directory: android
        run: |
          ./gradlew assembleProdDebug --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Locate built APK
        run: |
          find android/app/build/outputs -name "*.apk" -ls

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-debug-arm64
          path: android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
